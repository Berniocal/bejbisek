<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bejbísek</title>
<link rel="manifest" href="manifest.json">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 10px;
  background: #ffffff;
  color: #000000;
}

body.dark {
  background: #121212;
  color: #ffffff;
}

h1 { margin-bottom: 5px; }

.buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 15px 0;
}

button {
  flex: 1;
  padding: 15px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  color: white;
}

.prebal { background-color: #4CAF50; }
.kojeni { background-color: #2196F3; }
.export { background-color: #555; }
.darkmode { background-color: #222; }

.log { margin-top: 10px; text-align: left; }
.calendar { margin-top: 20px; }

input[type="date"] { font-size: 16px; padding: 5px; }

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.actions span {
  cursor: pointer;
  margin-left: 10px;
}

.bottom-buttons {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

@media print {
  .no-print { display: none; }
  #datum { display: none; }
  body { text-align: left; }
  .day-section { margin-bottom: 20px; }
}
</style>

</head>
<body>

<h1 id="datum"></h1>

<div class="buttons no-print">
  <button class="prebal" onclick="pridat('prebal')">Přebalování</button>
  <button class="kojeni" onclick="pridat('kojeni')">Kojení</button>
</div>

<div class="log no-print">
  <h3>Dnešní záznamy</h3>
  <div id="dnes"></div>
</div>

<div class="calendar no-print">
  <h3>Historie</h3>
  <input type="date" id="vyber" onchange="zobrazDen()">
  <div id="historie"></div>

  <div class="bottom-buttons">
    <button class="export" onclick="exportPDF()">Export do PDF</button>
    <button class="darkmode" onclick="toggleDarkMode()">🌙 Režim</button>
  </div>
</div>

<div id="printArea" style="display:none"></div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    window.location.reload();
  });
}

function dnesniDatum() {
  return new Date().toISOString().split('T')[0];
}

function formatDatum(d) {
  return new Date(d).toLocaleDateString('cs-CZ');
}

function formatCas() {
  return new Date().toLocaleTimeString('cs-CZ', {hour: '2-digit', minute:'2-digit'});
}

function nactiData() {
  return JSON.parse(localStorage.getItem("data")) || {};
}

function ulozData(data) {
  localStorage.setItem("data", JSON.stringify(data));
}

function pridat(typ) {
  let data = nactiData();
  let dnes = dnesniDatum();

  if (!data[dnes]) data[dnes] = { prebal: [], kojeni: [] };

  data[dnes][typ].push({ cas: formatCas() });

  ulozData(data);
  zobrazDnes();
}

function smazat(den, typ, index) {
  let data = nactiData();
  let zaznam = data[den][typ][index];
  let text = typ === "prebal" ? "Přebalování" : "Kojení";

  if (!confirm(`Opravdu chceš smazat: ${text} – ${zaznam.cas}?`)) return;

  data[den][typ].splice(index, 1);
  ulozData(data);
  zobrazDnes();
  zobrazDen();
}

function upravit(den, typ, index) {
  let data = nactiData();
  let novy = prompt("Uprav čas (HH:MM)", data[den][typ][index].cas);
  if (novy) {
    data[den][typ][index].cas = novy;
    ulozData(data);
    zobrazDnes();
    zobrazDen();
  }
}

function vykresli(den, elementId) {
  let data = nactiData();
  let div = document.getElementById(elementId);
  div.innerHTML = "";

  if (!den || !data[den]) return;

  ["prebal", "kojeni"].forEach(typ => {
    data[den][typ].forEach((z, i) => {
      let text = typ === "prebal" ? "🟢 Přebalování" : "🔵 Kojení";
      let poradi = i + 1;

      div.innerHTML += `
        <div class="item">
          <span>${text} – ${z.cas} (${poradi}.)</span>
          <span class="actions">
            <span onclick="upravit('${den}','${typ}',${i})">✏️</span>
            <span onclick="smazat('${den}','${typ}',${i})">❌</span>
          </span>
        </div>
      `;
    });
  });
}

function zobrazDnes() {
  let dnes = dnesniDatum();
  document.getElementById("datum").innerText = formatDatum(dnes);
  vykresli(dnes, "dnes");
}

function zobrazDen() {
  let den = document.getElementById("vyber").value;
  vykresli(den, "historie");
}

/* JEDNODUCHÝ FUNKČNÍ PDF EXPORT */
function exportPDF() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();

  let data = nactiData();
  let y = 10;

  doc.setFontSize(16);
  doc.text("Bejbisek - prehled", 10, y);
  y += 10;

  let dny = Object.keys(data).sort();

  dny.forEach(den => {
    doc.setFontSize(12);
    doc.text(formatDatum(den), 10, y);
    y += 6;

    ["prebal", "kojeni"].forEach(typ => {
      data[den][typ].forEach((z, i) => {
        let text = typ === "prebal" ? "Prebalovani" : "Kojeni";
        doc.text(`${text} - ${z.cas} (${i+1}.)`, 12, y);
        y += 6;

        if (y > 280) {
          doc.addPage();
          y = 10;
        }
      });
    });

    y += 4;
  });

  doc.save("bejbisek.pdf");
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

function initDarkMode() {
  let dark = localStorage.getItem("darkMode") === "true";
  if (dark) document.body.classList.add("dark");
}

// init
initDarkMode();
zobrazDnes();
</script>
<div id="installModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99999;align-items:center;justify-content:center;font-family:system-ui,sans-serif;">
  <div style="max-width:420px;width:90%;background:white;color:#111;border-radius:20px;padding:22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);">
    <h2 style="margin-top:0;">Nainstalovat aplikaci?</h2>

    <p style="line-height:1.5;">
      Tuto aplikaci si můžete přidat na plochu telefonu.
      Bude se pak otevírat jako běžná aplikace.
    </p>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">
      <button id="installNow" style="padding:13px;border:none;border-radius:12px;background:#22c55e;color:white;font-weight:700;font-size:1rem;">
        Instalovat aplikaci
      </button>

      <button id="installLater" style="padding:12px;border:none;border-radius:12px;background:#e5e7eb;color:#111;">
        Později
      </button>

      <button id="installNever" style="padding:12px;border:none;border-radius:12px;background:#fee2e2;color:#7f1d1d;">
        Neptat se znovu
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  const NEVER_KEY = "pwa_install_never_ask";
  const LATER_KEY = "pwa_install_later_until";

  let deferredInstallPrompt = null;

  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.navigator.standalone === true;
  }

  function showInstallModal(){
    if (isStandalone()) return;
    if (localStorage.getItem(NEVER_KEY) === "1") return;

    const laterUntil = Number(localStorage.getItem(LATER_KEY) || 0);
    if (Date.now() < laterUntil) return;

    const modal = document.getElementById("installModal");
    if (modal) modal.style.display = "flex";
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstallPrompt = e;

    setTimeout(showInstallModal, 1500);
  });

  document.addEventListener("DOMContentLoaded", function(){
    const installNow = document.getElementById("installNow");
    const installLater = document.getElementById("installLater");
    const installNever = document.getElementById("installNever");
    const modal = document.getElementById("installModal");

    if (!installNow || !installLater || !installNever || !modal) return;

    installNow.onclick = async function(){
      modal.style.display = "none";

      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else {
        alert("Pokud se instalace nespustila, klikněte vpravo nahoře na tři tečky a zvolte „Instalovat aplikaci“ nebo „Přidat na plochu“.");
      }
    };

    installLater.onclick = function(){
      localStorage.setItem(LATER_KEY, Date.now() + 3*24*60*60*1000);
      modal.style.display = "none";
    };

    installNever.onclick = function(){
      localStorage.setItem(NEVER_KEY, "1");
      modal.style.display = "none";
    };
  });
})();
</script>
</body>
</html>
